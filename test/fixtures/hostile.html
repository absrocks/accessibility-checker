<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A page that tries to interfere</title>
  <script>try { window.parent.hostileRan = true; window.parent.document.title = 'pwned'; } catch (e) {}</script>
</head>
<body onload="try { top.hostileRan = true; } catch (e) {}">
  <main>
    <h1>Hostile fixture</h1>
    <img src="missing.png" alt="" onerror="try { parent.hostileRan = true; parent.document.title = 'pwned'; } catch (e) {}">
    <button type="button" onclick="parent.hostileRan = true"></button>
    <iframe title="nested" srcdoc="<script>try { top.hostileRan = true; top.document.title = 'pwned'; } catch (e) {}</script>"></iframe>
  </main>
</body>
</html>
